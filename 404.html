<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 — Cheng-Nan Liu</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌋</text></svg>">
<style>
  body{background:#06080c; color:#e9edf4; font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
       display:flex; align-items:center; justify-content:center; min-height:100vh; margin:0; padding:24px}
  .box{max-width:560px; line-height:2}
  .g{color:#34d399} .c{color:#22d3ee} .d{color:#8d99aa}
  a{color:#22d3ee}
  h1{font-size:44px; margin:0 0 10px; background:linear-gradient(100deg,#22d3ee,#818cf8,#c084fc);
     -webkit-background-clip:text; background-clip:text; color:transparent}
</style>
</head>
<body>
<div class="box">
  <h1>404</h1>
  <div><span class="g">cnliu@earth:~$</span> locate requested_page</div>
  <div class="d">→ signal lost — no seismic energy detected at this address.</div>
  <div class="d" id="redir"></div>
  <div style="margin-top:14px"><span class="g">cnliu@earth:~$</span> <a href="/cnliu_web/">cd ~/home</a></div>
</div>
<script>
// redirect old Jekyll-site URLs to their new anchors
const map = {
  "publications":"/cnliu_web/#publications",
  "research":"/cnliu_web/#work",
  "bio":"/cnliu_web/#about",
  "cv":"/cnliu_web/files/Resume_Cheng-Nan_Liu.pdf",
  "links":"/cnliu_web/#contact",
  "allnews":"/cnliu_web/#updates",
  "teach":"/cnliu_web/#about",
  "pictures":"/cnliu_web/"
};
const seg = location.pathname.replace(/\/+$/,"").split("/").pop().toLowerCase();
if (map[seg]) {
  document.getElementById("redir").textContent = "→ found it in the new site — redirecting…";
  setTimeout(()=>location.replace(map[seg]), 900);
}
</script>
</body>
</html>
